var SUPPORTED = ["en","pt-PT","pt-BR","es"];

function detect(){
  var list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || "en"];
  for (var i = 0; i < list.length; i++){
    var l = String(list[i]).toLowerCase();
    if (l === "pt-br") return "pt-BR";
    if (l.indexOf("pt") === 0) return "pt-PT";
    if (l.indexOf("es") === 0) return "es";
    if (l.indexOf("en") === 0) return "en";
  }
  return "en";
}

function apply(code){

  document.title = d.title;
  var nodes = document.querySelectorAll("[data-i]");
  for (var i = 0; i < nodes.length; i++){
    var k = nodes[i].getAttribute("data-i");
    if (d[k] !== undefined) nodes[i].textContent = d[k];
  }
  document.getElementById("lang").value = code;
}
